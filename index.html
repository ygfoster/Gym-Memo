<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Life Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life Tracker">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <!-- キャッシュ強制更新 v10 -->
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <!-- メインのカルーセル構造 -->
  <div class="app-container">
    <main id="main-content" class="viewport">
      <div id="swipe-wrapper" class="swipe-wrapper">
        
        <!-- 1. Life -->
        <section id="view-life" class="view-section">
          <h1 class="view-title">私の寿命</h1>
          <div class="timer-display" id="timer-life"></div>
        </section>
        
        <!-- 2. Born -->
        <section id="view-born" class="view-section">
          <h1 class="view-title">私が生まれてから</h1>
          <div class="timer-display" id="timer-born"></div>
        </section>
        
        <!-- 3. Custom Dashboard (1層目) -->
        <section id="view-custom-dashboard" class="view-section scrollable" style="padding: 24px 20px;">
          <div class="dashboard-header">
            <h1 class="view-title" style="margin-bottom: 0;">Custom Timers</h1>
            <button id="btn-open-add-modal" class="btn-icon-add">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <div id="custom-dashboard-list" class="custom-dashboard-list">
            <!-- JSでカードが生成される -->
          </div>
        </section>
        
        <!-- 4. Settings (カスタム関連を排除し純化) -->
        <section id="view-settings" class="view-section scrollable">
          <h1 class="view-title">Settings</h1>
          <div class="settings-form">
            <div class="form-group">
              <label>生まれた日付</label>
              <div class="date-picker-group" id="picker-birth"></div>
              <div class="error-msg" id="error-birth">未来の日付は選択できません</div>
            </div>
            <div class="form-group">
              <label>寿命</label>
              <div id="input-life-wrap"></div>
            </div>
            <button id="btn-save-settings" class="btn-primary" style="margin-top: 40px;">保存して反映</button>
          </div>
        </section>
        
      </div>
    </main>

    <!-- ボトムナビゲーション -->
    <nav class="floating-tab-bar" id="bottom-nav">
      <button class="tab-item active" data-tab="view-life">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Life</span>
      </button>
      <button class="tab-item" data-tab="view-born">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Born</span>
      </button>
      <button class="tab-item" data-tab="view-custom-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg><span>Custom</span>
      </button>
      <button class="tab-item" data-tab="view-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Setting</span>
      </button>
    </nav>
  </div>

  <!-- 2層目：詳細タイマー（モーダル内でスワイプ可能） -->
  <div id="custom-detail-modal" class="apple-modal">
    <div class="modal-header">
      <button id="btn-close-detail" class="btn-text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg> 戻る
      </button>
      <span id="detail-pagination" class="modal-pagination">1 / 1</span>
      <div style="width: 60px;"></div> <!-- レイアウト用ダミー -->
    </div>
    <div class="modal-body viewport">
      <div id="custom-detail-swipe-wrapper" class="swipe-wrapper">
        <!-- JSで各タイマー画面が生成される -->
      </div>
    </div>
  </div>

  <!-- 追加用ダイアログ -->
  <div id="custom-add-modal" class="apple-modal center-dialog">
    <div class="dialog-content">
      <h2 style="margin-bottom: 24px; font-size: 1.2rem;">新規カスタムタイマー</h2>
      <div class="form-group" style="margin-bottom: 24px;">
        <label>タイトル</label>
        <input type="text" id="new-custom-title" class="input-field" placeholder="例: 禁煙">
      </div>
      <div class="form-group" style="margin-bottom: 32px;">
        <label>開始した日付</label>
        <div class="date-picker-group" id="picker-new-custom"></div>
        <div class="error-msg" id="error-new-custom">未来の日付は選択できません</div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button id="btn-cancel-add" class="btn-secondary" style="flex: 1; padding: 16px;">キャンセル</button>
        <button id="btn-save-new-custom" class="btn-primary" style="flex: 1; padding: 16px;">追加する</button>
      </div>
    </div>
  </div>

  <!-- キャッシュ強制更新 v10 -->
  <script src="app.js?v=10"></script>
</body>
</html>
