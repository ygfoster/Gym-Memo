<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- タイマー0時や完了時の通知バナー -->
  <div id="notification-banner" class="notification-banner">
    <div id="notification-text" class="notification-text">次のセットを開始</div>
  </div>

  <!-- ヘッダー (ハンバーガーメニュー配置) -->
  <header class="app-header">
    <div class="header-title">Life Tracker</div>
    <button id="btn-hamburger" class="btn-hamburger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <!-- メインコンテンツ (スワイプ領域) -->
  <main id="main-content">
    <div id="swipe-wrapper">
      <section id="view-life" class="view-section">
        <h1 class="view-title">Life Limit</h1>
        <div id="timer-life" class="timer-display"></div>
      </section>
      
      <section id="view-born" class="view-section">
        <h1 class="view-title">Time Alive</h1>
        <div id="timer-born" class="timer-display"></div>
      </section>

      <section id="view-custom-empty" class="view-section" style="display:none;">
        <h1 class="view-title" style="color: #666; font-size: 1.2rem;">カスタムタイマーはありません</h1>
      </section>
    </div>
  </main>

  <!-- ボトムナビゲーション -->
  <nav id="bottom-nav" class="floating-nav">
    <button class="tab-item active" data-tab="view-life">Life</button>
    <button class="tab-item" data-tab="view-born">Born</button>
    
    <!-- 中央の巨大FAB (トレーニング追加ボタン) -->
    <div class="fab-wrapper">
      <div class="fab-cutout"></div>
      <button id="btn-add-training" class="fab-button">
        <!-- ダンベルアイコン -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5h11M6.5 17.5h11M4 9h16v6H4zM2 10.5h2v3H2zM20 10.5h2v3h-2z"/>
        </svg>
      </button>
    </div>

    <button class="tab-item" data-tab="view-custom">Custom</button>
    <!-- インジケーター表示用スペース -->
    <div id="custom-indicators" class="indicators-container"></div>
  </nav>

  <!-- Settings ドロワー (ハンバーガーメニューから開く) -->
  <div id="settings-drawer" class="settings-drawer">
    <div class="drawer-header">
      <h2>設定</h2>
      <button id="btn-close-settings" class="btn-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="drawer-content" id="view-settings">
      <div class="settings-section">
        <label class="custom-input-label">生年月日</label>
        <div id="picker-birth" class="date-picker-group"></div>
      </div>
      <div class="settings-section">
        <label class="custom-input-label">想定寿命</label>
        <div id="input-life-wrap"></div>
      </div>
      <div class="settings-section">
        <label class="custom-input-label">カスタムタイマー</label>
        <div id="custom-settings-list"></div>
        <button id="btn-add-custom" class="btn-action">+ 追加</button>
      </div>
      <button id="btn-save-settings" class="btn-primary">保存して反映</button>
    </div>
  </div>

  <!-- 種目追加用 Morphing モーダル -->
  <div id="morph-modal" class="morph-modal">
    <div class="modal-header">
      <h2>トレーニングを追加</h2>
      <button id="btn-close-morph" class="btn-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="modal-content">
      <!-- トレーニング追加のUI要素を配置 -->
      <p style="color:#888; text-align:center; margin-top:50px;">ここに種目やセットの追加UIを実装します。</p>
    </div>
  </div>

  <!-- 初回セットアップ用オーバーレイ -->
  <div id="setup-overlay" class="setup-overlay">
    <div class="setup-box">
      <h2>初期設定</h2>
      <p>生年月日を入力してください</p>
      <!-- 初期化時にここにピッカーがインジェクトされる想定 -->
      <button id="btn-start-setup" class="btn-primary" style="margin-top: 20px;">はじめる</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
